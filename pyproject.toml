[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "network-monitoring"
version = "1.0.0"
description = "Mapeo automático de red (activo o SNMP + LLDP/CDP) con generación de diagramas draw.io"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6", "pysnmp>=7.1", "netaddr>=1.2", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pyinstaller>=6.6", "pytest", "Pillow"]

[project.gui-scripts]
netmon = "netmon.__main__:main"

[tool.setuptools.packages.find]
include = ["netmon*"]

[tool.setuptools.package-data]
netmon = ["assets/*", "assets/fonts/*"]
