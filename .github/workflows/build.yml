name: Compilar instaladores

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: python -m pytest -q tests
      - name: PyInstaller
        run: pyinstaller packaging/netmon.spec --noconfirm --clean
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path netmon\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$version" packaging\windows\installer.iss
      - name: Portable (zip)
        shell: pwsh
        run: Compress-Archive -Path dist\NetworkMonitoring\* -DestinationPath dist\NetworkMonitoring-portable-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/NetworkMonitoring-Setup-*.exe
            dist/NetworkMonitoring-portable-windows.zip

  linux:
    runs-on: ubuntu-22.04   # glibc antigua = compatible con más distribuciones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest -q tests
      - name: PyInstaller
        run: pyinstaller packaging/netmon.spec --noconfirm --clean
      - name: Paquetes .deb y .tar.gz
        run: |
          VERSION=$(python -c "import netmon; print(netmon.__version__)")
          bash packaging/linux/build_linux.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  # Publica (o actualiza) la Release vX.Y.Z según la versión de netmon/__init__.py
  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versión
        id: v
        run: echo "version=$(python3 -c 'import netmon; print(netmon.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Network Monitoring ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: artifacts/**/*
          make_latest: true
          body: |
            **Windows:** descarga `NetworkMonitoring-Setup-${{ steps.v.outputs.version }}.exe`, ábrelo y sigue el asistente.
            Sin instalar: `NetworkMonitoring-portable-windows.zip`.

            **Linux:** `sudo apt install ./network-monitoring_${{ steps.v.outputs.version }}_amd64.deb`, o el `.tar.gz` con `./install.sh` en otras distribuciones.
